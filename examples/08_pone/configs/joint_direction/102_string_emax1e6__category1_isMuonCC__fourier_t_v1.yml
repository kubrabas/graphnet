experiment_name: fourier_t_v1

# Paper-inspired T transformer without the P-ONE PMT-direction augmentation.
# This is the clean architecture comparison against the existing DynEdge.
experiment_contract:
  varied_fields:
    - training.stage_a.base_lr
    - training.stage_a.peak_lr
    - training.stage_a.warmup_fraction
    - training.stage_b.peak_lr
    - training.stage_b.warmup_fraction
    - loader.batch_size
    - loader.val_batch_size
    - loader.accumulate_grad_batches
    - model.name
    - model.transformer
    - optimizer.name
    - optimizer.weight_decay
    - optimizer.eps
    - trainer.precision
    - trainer.gradient_clip_val

task:
  type: reconstruction
  mode: joint_direction
  targets: [zenith_azimuth]

mc: 340StringMC
geometry: 102_string_emax1e6
flavors: [Muon, Electron, Tau, NC]

routing:
  category: category1_isMuonCC
  classes: [1]

output:
  root_dir: /project/def-nahee/kbas/Graphnet-Applications/Results
  dirs:
    train: train_and_val

run:
  existing_output: error

environment:
  graphnet_source: /project/def-nahee/kbas/graphnet/src
  container_image: docker://rorsoe/graphnet:graphnet-1.8.0-cu126-torch26-ubuntu-22.04

validation:
  enabled: true
  checkpoint_name: best_macro_median
  write_predictions: true
  write_summary: true
  write_plots: true

data:
  paths_py: /project/def-nahee/kbas/Graphnet-Applications/Metadata/paths.py
  parquet_table: STRING340MC_PARQUET
  pulsemaps: features
  truth_table: truth
  features: [pmt_x, pmt_y, pmt_z, dom_time, charge]
  physical_event_id_columns: [RunID, SubrunID, EventID, SubEventID]
  trigger_column: triggered_nonoise_102_string
  parquet_cache_size: 1
  percentiles_csv: null
  truth_all:
    - event_no
    - RunID
    - SubrunID
    - EventID
    - SubEventID
    - totalEnergy
    - zenith
    - azimuth
    - pid
    - is_CC
    - category1_isMuonCC
    - category2_tauCC_others_muonCC
    - category_3_contains_muon
    - triggered_nonoise_102_string

weighting:
  alpha: 0.5
  clip_min: 0.2
  clip_max: 5.0
  out_of_range: error
  log10_energy_bin_edges: [2.0, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7, 2.8, 2.9, 3.0, 3.1, 3.2, 3.3, 3.4, 3.5, 3.6, 3.7, 3.8, 3.9, 4.0, 4.1, 4.2, 4.3, 4.4, 4.5, 4.6, 4.7, 4.8, 4.9, 5.0, 5.1, 5.2, 5.3, 5.4, 5.5, 5.6, 5.7, 5.8, 5.9, 6.0]

loss:
  angular_surrogate: opening_angle
  vmf_factor: 0.05

metrics:
  log10_energy_bin_edges: [2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0]
  minimum_events_per_bin: 100

loader:
  batch_size: 16
  val_batch_size: 16
  accumulate_grad_batches: 64
  num_workers: 8
  multiprocessing_context: spawn
  pin_memory: true

training:
  seed: 20260202
  stage_a:
    objective: vmf
    max_epochs: 3
    base_lr: 2.0e-5
    peak_lr: 5.0e-4
    warmup_fraction: 0.01
    early_stopping: false
    early_stopping_patience: 3
    early_stopping_min_delta: 0.001
  stage_b:
    objective: angular_hybrid
    max_epochs: 30
    base_lr: 1.0e-6
    peak_lr: 2.0e-5
    warmup_fraction: 0.01
    early_stopping: true
    early_stopping_patience: 7
    early_stopping_min_delta: 0.001

model:
  name: fourier_spacetime_transformer
  transformer:
    dimension: 192
    base_dimension: 128
    depth_relative: 4
    relative_bias_blocks: 4
    depth_transformer: 12
    head_size: 32
    train_max_pulses: 256
    eval_max_pulses: 512
    train_selection: random
    eval_selection: uniform_time
    use_pmt_direction: false
    position_scale_m: 500.0
    time_scale_ns: 30000.0
    charge_log10_scale: 3.0
    position_fourier_scale: 4096.0
    time_fourier_scale: 4096.0
    charge_fourier_scale: 1024.0
    relative_fourier_scale: 1024.0
    relative_clip: 4.0
    speed_of_light_m_per_ns: 0.3
    dropout: 0.0

optimizer:
  name: adamw
  weight_decay: 0.05
  eps: 1.0e-7

checkpointing:
  primary_monitor: val_macro_median_deg
  monitors:
    best_macro_median: val_macro_median_deg
    best_global_median: val_global_median_deg
    best_global_q68: val_global_q68_deg
    best_weighted_objective: val_objective_loss_weighted
  save_every_epoch: false

trainer:
  accelerator: gpu
  devices: 1
  require_gpu: true
  precision: bf16-mixed
  float32_matmul_precision: high
  gradient_clip_val: 3.0
  num_sanity_val_steps: 2
  deterministic: false
  progress_bar: false
  model_summary: true
  log_every_n_steps: 50

slurm:
  account: def-nahee
  time: "24:00:00"
  mem: 64G
  cpus_per_task: 8
  gpus_per_node: nvidia_h100_80gb_hbm3_3g.40gb:1
  exclude: fc10713,fc11013
