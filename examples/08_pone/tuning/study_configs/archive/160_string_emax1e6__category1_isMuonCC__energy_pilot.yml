study_name: reco_160str_category1_energy_pilot
campaign_dir: /project/def-nahee/kbas/Graphnet-Applications/Results/340StringMC/hyperparameter_tuning/160_string_emax1e6/reconstruction/category1_isMuonCC/energy/pilot_v1

task_type: reconstruction
base_config: /project/def-nahee/kbas/graphnet/examples/08_pone/configs/reconstruction/160_string_emax1e6__category1_isMuonCC.yml
target: energy
route_classes: [0, 1]

# Two successful trials verify config generation, parallel submission,
# monitoring, objective collection, persistence, and restart behavior. The
# third slot replaces the 40 GB GPU trial that failed with CUDA OOM.
n_trials: 3
max_parallel_gpu_jobs: 4
poll_seconds: 60

sampler:
  seed: 20260714
  n_startup_trials: 2
  multivariate: true

search_space:
  peak_lr:
    type: float
    low: 5.0e-4
    high: 4.0e-3
    log: true
  nb_neighbours:
    type: categorical
    choices: [6, 8, 10, 12]

fixed_overrides:
  weights:
    enabled: false
  training:
    seed: 20260202
    max_epochs: 60
    early_stopping_patience: 8
    batch_size: 256
    accumulate_grad_batches: 4
    base_lr: 1.0e-5
    warmup_fraction: 0.5
  validation:
    write_predictions: true
    write_summary: true
    write_plots: true
  slurm:
    account: def-nahee
    time: "36:00:00"
    mem: 96G
    cpus_per_task: 8
    gpus_per_node: h100:1
    exclude: fc10713

controller_slurm:
  account: def-nahee
  time: "36:00:00"
  mem: 4G
  cpus_per_task: 1
